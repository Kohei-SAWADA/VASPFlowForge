# pipeline.conf for the STO example.
#
# Select the CPU or GPU module environment for your workstation and set
# VASP_CMD. The pipeline refuses to start while VASP_CMD is unset
# (a dry run still works and will only warn).
#
# CPU VASP 6.4.3:
# module load intel
# module load impi
# module load vasp
# VASP_CMD="mpirun -np 16 vasp_std"
#
# GPU VASP-GPU 6.4.3:
# module load nvidia
# module load nvompi
# module load vasp-gpu
# VASP_CMD="mpirun -np 4 vasp_std"

REUSE_WAVECAR_FOR_DOS="auto"
